<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STRATA — Sistem Terpadu Registrasi dan Tata Formulir</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #E0F2FE; }
  iframe { width: 100%; height: 100vh; height: 100dvh; border: none; display: block; }
  .loading {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, #E6F6FF 0%, #D3EEF8 60%, #BFE3F3 100%);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; color: #475569;
    font-family: system-ui, sans-serif; font-size: 14px; transition: opacity .4s;
  }
  .brand { font-size: 32px; font-weight: 900; letter-spacing: .6px; color: #0284C7; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(14,165,233,.2); border-top-color: #06B6D4;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loading" id="loading">
  <div class="brand">STRATA</div>
  <div class="spinner"></div>
  <div>Memuat aplikasi...</div>
</div>
<iframe
  id="app"
  src="https://script.google.com/macros/s/AKfycbwzDTj4Yh3qS6lyXe6-BFPYD0xRdwlnXLHR4hA2JS1quEeKSFVeTiTl2sxsIXpd6Vyv/exec"
  onload="document.getElementById('loading').style.opacity='0';setTimeout(function(){document.getElementById('loading').style.display='none'},400)"
  allow="clipboard-write"
></iframe>
<script>
function fixHeight() {
  var el = document.getElementById('app');
  if (el) el.style.height = window.innerHeight + 'px';
}
fixHeight();
window.addEventListener('resize', fixHeight);
window.addEventListener('orientationchange', function() { setTimeout(fixHeight, 200); });
</script>
</body>
</html>
