<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STRATA — Formulir</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #E0F2FE; }
  iframe { width: 100%; height: 100vh; height: 100dvh; border: none; display: block; }
  .loading {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, #E6F6FF 0%, #D3EEF8 60%, #BFE3F3 100%);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; color: #475569;
    font-family: system-ui, sans-serif; font-size: 14px; text-align: center; padding: 24px;
    transition: opacity .4s;
  }
  .brand { font-size: 30px; font-weight: 900; letter-spacing: .6px; color: #0284C7; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(14,165,233,.2); border-top-color: #06B6D4;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  .err { color: #B91C1C; font-weight: 700; }
  .hint { color: #64748B; font-size: 12.5px; line-height: 1.6; }
  a.btn { display: inline-block; margin-top: 6px; padding: 9px 18px; border-radius: 12px; color: #fff; text-decoration: none; font-weight: 700;
          background: linear-gradient(135deg, #0284C7, #06B6D4); }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loading" id="loading">
  <div class="brand">STRATA</div>
  <div class="spinner" id="spin"></div>
  <div id="msg">Memuat formulir...</div>
</div>
<iframe id="app" src="" allow="clipboard-write" title="Formulir STRATA"
  onload="if(this.src){document.getElementById('loading').style.opacity='0';setTimeout(function(){document.getElementById('loading').style.display='none'},400)}">
</iframe>
<script>
// Link pendek: form.akuifera.id/98  →  formulir FORM_098
// GitHub Pages menampilkan halaman ini untuk alamat yang tidak punya file fisik.
var GAS_URL = 'https://script.google.com/macros/s/AKfycbx-tniOp_G5s6kGFIf82tgwkQNOIaGaAtY80sH-W5pJCQV1Ls9zSAci6LU--2WRODqd/exec';

var seg  = window.location.pathname.split('/').filter(function (p) { return p.length > 0; });
var last = seg.length ? decodeURIComponent(seg[seg.length - 1]) : '';
var m    = last.match(/^(?:form[_-]?)?0*(\d{1,6})$/i);

if (m) {
  document.getElementById('app').src = GAS_URL + '?page=form&id=' + encodeURIComponent(m[1]);
} else {
  document.getElementById('spin').style.display = 'none';
  document.getElementById('msg').innerHTML =
    '<div class="err">Halaman tidak ditemukan.</div>' +
    '<div class="hint">Periksa kembali alamat formulir. Contoh yang benar: form.akuifera.id/98</div>' +
    '<a class="btn" href="/">Ke halaman utama</a>';
}

function fixHeight() {
  var el = document.getElementById('app');
  if (el) el.style.height = window.innerHeight + 'px';
}
fixHeight();
window.addEventListener('resize', fixHeight);
window.addEventListener('orientationchange', function () { setTimeout(fixHeight, 200); });
</script>
</body>
</html>
